name: 空き状況を取得

on:
  schedule:
    # 日本時間 6:07 と 18:07（UTC で指定）。毎時0分は混むので少しずらす
    - cron: "7 21 * * *"
    - cron: "7 9 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "このシステムだけ取得（例: aichi_kyodo）。空欄なら全部"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存関係をインストール
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 空き状況を取得
        run: |
          if [ -n "${{ inputs.only }}" ]; then
            python -m scraper.run --only "${{ inputs.only }}"
          else
            python -m scraper.run
          fi

      - name: 取得画面を保存（手順調整用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-pages
          path: debug/
          retention-days: 7
          if-no-files-found: ignore

      - name: 結果をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "空き状況を更新 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
            git push
          fi
